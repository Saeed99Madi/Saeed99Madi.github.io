<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      CSP is delivered as a meta tag because GitHub Pages cannot set response
      headers. Moving to a host that can (Netlify, Cloudflare) means moving this
      to a real header and adding frame-ancestors + X-Content-Type-Options,
      which meta tags cannot express.

      style-src needs 'unsafe-inline': Emotion injects <style> elements at
      runtime and a static host cannot mint per-request nonces. No third-party
      origin is allowed at all — the fonts are self-hosted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               form-action 'none';
               base-uri 'self';
               object-src 'none';
               frame-src 'none';
               manifest-src 'self';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Said Madi — Software Engineer · AI Platforms · Gaza</title>
    <meta
      name="description"
      content="Said Madi (Saeed Madi) — software engineer in Gaza, Palestine. Co-founder of RenderForge, engineer at Metafore. AI-native platforms, LLM orchestration, Kubernetes, AWS."
    />
    <meta name="author" content="Said Madi" />

    <meta name="twitter:image:alt" content="Said Madi — Software Engineer, Gaza, Palestine" />

    <meta name="theme-color" content="#0E1013" />

    <!--
      Favicon set. Googlebot probes /favicon.ico first regardless of these
      tags, so that file must exist; the sized PNGs satisfy Google's rule that
      a search-results favicon be square and a multiple of 48px. The SVG is
      for modern browser tabs, which prefer it.
    -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!--
      Self-hosted fonts, relative hrefs so the site works under any base path.
      Only the two faces that paint the hero are preloaded; the Arabic and mono
      faces load on demand via their unicode-range.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/ibm-plex-sans-normal-600-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/ibm-plex-mono-normal-400-latin.woff2" />
    <link rel="stylesheet" href="./fonts.css" />

    <!--
      Structured data. `sameAs` is the important part for SEO: it tells search
      engines that this site, the GitHub account, the LinkedIn profile and the
      Upwork profile are all the same person, so they consolidate into one
      entity rather than competing for the same name.
    -->

        "givenName": "Said",
        "familyName": "Madi",
        "alternateName": [
          "Saeed Madi",
          "Saed Madi",
          "Said MADI",
          "سعيد ماضي",
          "Saeed99Madi"
        ],
        "jobTitle": "Software Engineer",
        "description": "Software engineer building AI-native platforms and cloud infrastructure.",
        "email": "mailto:saed.dev9@gmail.com",
        "telephone": "+970599266293",
        "url": "%VITE_SITE_URL%",
        "image": "%VITE_SITE_URL%og.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Gaza",
          "addressCountry": "PS"
        },
        "sameAs": [
          "https://github.com/Saeed99Madi",
          "https://www.linkedin.com/in/saedmadi/",
          "https://www.upwork.com/freelancers/~01761b751cf50bf51d",
          "https://www.facebook.com/saed.madi.94",
          "https://www.instagram.com/saeed.mahmoud.99/"
        ],
        "alumniOf": {

          "name": "Al-Azhar University Gaza"
        },
        "worksFor": [

            "name": "Metafore"
          },

            "@type": "Organization",
            "name": "RenderForge",
            "url": "https://renderforge.ai"

        ],
        "knowsLanguage": [
          { "@type": "Language", "name": "Arabic", "alternateName": "ar" },
          { "@type": "Language", "name": "English", "alternateName": "en" }
        ],
        "knowsAbout": [
          "Artificial intelligence platforms",
          "Large language model orchestration",
          "LangGraph",
          "Multi-agent systems",
          "Full-stack web development",
          "Cloud infrastructure",
          "Kubernetes",
          "TypeScript",
          "Python"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--

      renders from, so it cannot drift away from the real page.
    -->
    <noscript>
